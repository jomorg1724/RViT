   <g id="text_2">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="52.013974" y="17.92" transform="rotate(-0 52.013974 17.92)">Element-wise affine feedback (affine_ew)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(82.099679 147.922759)">memory</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(92.010929 158.00079)">Hₜ₋₁</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="316.823818" y="152.961775" transform="rotate(-0 316.823818 152.961775)">b = tanh(BH)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="536.819688" y="140.407359" transform="rotate(-0 536.819688 140.407359)">γ = Gγ(b)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="536.819688" y="215.761978" transform="rotate(-0 536.819688 215.761978)">β = Gβ(b)</text>
   </g>
   <g id="text_7">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(71.429054 281.836527)">visual tokens</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(96.491945 291.914558)">Xₜ</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(316.800642 281.864652)">X′ = γ ⊙ X + β</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(292.289705 291.942683)">element-wise modulation</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(560.382946 277.219433)">Q,K,V = W(X′)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(545.527204 286.737573)">A = softmax(QKᵀ/√d)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(565.890016 296.255714)">Z = X + AV</text>
   </g>
   <g id="text_10">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(744.257563 281.836527)">Zₜ</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(728.061079 291.914558)">to xLSTM</text>
   </g>
   <g id="text_11">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start" x="31.643986" y="401.566651" transform="rotate(-0 31.643986 401.566651)">Initialization: γ = 1 and β = 0, so routing starts as plain self-attention.</text>
   </g>
