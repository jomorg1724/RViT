   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(67.355057 145.830356)">visual tokens</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(92.417947 155.908388)">Xₜ</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(78.025682 279.744124)">memory</text>
    <text style="font-size: 9px; font-family: 'DejaVu Sans'" transform="translate(87.936932 289.822155)">Hₜ₋₁</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: middle" x="312.74982" y="150.869372" transform="rotate(-0 312.74982 150.869372)">Q = Wq(X)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="341.267803" y="240.72663" transform="rotate(-0 341.267803 240.72663)">K = [Wkx(X) ∥ Wkh(H)]</text>
   </g>
   <g id="text_7">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="341.267803" y="328.60754" transform="rotate(-0 341.267803 328.60754)">V = [Wvx(X) ∥ Wvh(H)]</text>
   </g>
   <g id="text_8">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(533.305211 220.150297)">A = softmax(QKᵀ/√d)</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(577.559664 229.668438)"/>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(534.117359 239.186578)">N queries × 2N keys</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(536.984781 248.704719)">(image + memory)</text>
   </g>
   <g id="text_9">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(724.775923 229.668438)">Z = X + AV</text>
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'" transform="translate(729.205884 239.186578)">to xLSTM</text>
   </g>
   <g id="text_10">
    <text style="font-size: 8.7px; font-family: 'DejaVu Sans'; text-anchor: start" x="31.643986" y="405.751456" transform="rotate(-0 31.643986 405.751456)">The same recurrent memory and actor/critic heads follow; only the routing operator changes.</text>
   </g>
